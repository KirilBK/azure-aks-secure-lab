apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: app1-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app1
          image: REPLACE_WITH_acr_login_server/app1:latest
          ports:
            - containerPort: 8080
          env:
            - name: SQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app1-sql
                  key: SQL_CONNECTION_STRING
          readinessProbe:
            httpGet:
              path: /healthz.php
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz.php
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kv
              mountPath: /mnt/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-log
              mountPath: /var/log/apache2
      volumes:
        - name: kv
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app1-kv
        - name: tmp
          emptyDir: {}
        - name: apache-run
          emptyDir: {}
        - name: apache-log
          emptyDir: {}
