apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app1-kv
  namespace: app1
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_WITH_app1_workload_identity_client_id"
    keyvaultName: "REPLACE_WITH_key_vault_name"
    tenantId: "REPLACE_WITH_key_vault_tenant_id"
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
  # Mirror the mounted secret into a K8s Secret so it can be an env var.
  secretObjects:
    - secretName: app1-sql
      type: Opaque
      data:
        - objectName: sql-connection-string
          key: SQL_CONNECTION_STRING
